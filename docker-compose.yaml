version: "3.8"

services:
  postgres:
    image: postgres:14
    container_name: reacher-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-reacher_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reacher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reacher-network

  backend:
    image: reacherhq/backend:latest
    container_name: reacher-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Backend Configuration
      RCH__BACKEND_NAME: ${RCH__BACKEND_NAME:-reacher-backend}
      RCH__HTTP_HOST: 0.0.0.0
      RCH__HTTP_PORT: 8080
      RUST_LOG: ${RUST_LOG:-reacher=info}
      
      # Bulk API Configuration
      RCH_ENABLE_BULK: "1"
      RCH__STORAGE__POSTGRES__DB_URL: postgres://${POSTGRES_USER:-reacher}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-reacher_db}
      
      # Optional: SMTP Configuration
      RCH__HELLO_NAME: ${RCH__HELLO_NAME:-localhost}
      RCH__FROM_EMAIL: ${RCH__FROM_EMAIL:-hello@localhost}
      RCH__SMTP_TIMEOUT: ${RCH__SMTP_TIMEOUT:-45}
      
      # Optional: Security
      RCH__HEADER_SECRET: ${RCH__HEADER_SECRET:-}
      
      # Optional: Proxy Configuration (only set if provided in .env)
      # If you need a proxy, add these to your .env file:
      # RCH__PROXY__HOST=your-proxy-host.com
      # RCH__PROXY__PORT=1080
      # RCH__PROXY__USERNAME=proxy_username
      # RCH__PROXY__PASSWORD=proxy_password
      
      # Optional: Throttle Configuration
      RCH__THROTTLE__MAX_REQUESTS_PER_SECOND: ${RCH__THROTTLE__MAX_REQUESTS_PER_SECOND:-}
      RCH__THROTTLE__MAX_REQUESTS_PER_MINUTE: ${RCH__THROTTLE__MAX_REQUESTS_PER_MINUTE:-}
      RCH__THROTTLE__MAX_REQUESTS_PER_HOUR: ${RCH__THROTTLE__MAX_REQUESTS_PER_HOUR:-}
      RCH__THROTTLE__MAX_REQUESTS_PER_DAY: ${RCH__THROTTLE__MAX_REQUESTS_PER_DAY:-}
    restart: always
    networks:
      - reacher-network

  nginx:
    image: nginx:alpine
    container_name: reacher-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: always
    networks:
      - reacher-network

volumes:
  postgres_data:

networks:
  reacher-network:
    driver: bridge

